[package]
name = "yarmiplayservertv"
version = "1.6.1"
description = "Host a Syncplay server and a Jellyfin server from your desktop"
authors = ["Yarmiplay"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Yarmiplay/YarmiplayServerTV"
edition = "2021"
rust-version = "1.87"

[lib]
name = "yarmiplayservertv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
directories = "6"
rand = "0.8"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
# Approved Syncplay devices: P-256 signatures (ring is rustls's provider already)
ring = "0.17"
base64 = "0.22"

# Networking, UPnP and ACME (ported from GoogleSnakeOnline)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
if-addrs = "0.13"
socket2 = "0.5"
roxmltree = "0.20"
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "ring", "rcgen"] }
x509-parser = "0.18"
rcgen = "0.14"
p12-keystore = "0.3"
futures-util = "0.3"

# Browser access to the control panel (127.0.0.1 only), and the relay and
# Jellyfin HTTP that shares the Syncplay port
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }

# Jellyfin download / extraction
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
liblzma = { version = "0.4", features = ["static"] }

keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx"] }
windows = { version = "0.62", features = ["ApplicationModel", "ApplicationModel_Activation", "Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
