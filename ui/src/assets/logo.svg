<svg xmlns="http://www.w3.org/2000/svg" viewBox="7 7 94 94">
  <defs>
    <linearGradient id="tile" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1B2B43"/>
      <stop offset="45%" stop-color="#101B2B"/>
      <stop offset="100%" stop-color="#080D16"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#70A8DB" stop-opacity="0.35"/>
      <stop offset="25%" stop-color="#2D527C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0E1E33" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="top" x1="32" y1="19" x2="70" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E7FBFF"/>
      <stop offset="42%" stop-color="#9BE4FB"/>
      <stop offset="100%" stop-color="#5EC8F6"/>
    </linearGradient>
    <linearGradient id="front" x1="37" y1="32" x2="37" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3CB6F8"/>
      <stop offset="55%" stop-color="#1494EA"/>
      <stop offset="100%" stop-color="#0B74D4"/>
    </linearGradient>
    <linearGradient id="side" x1="56" y1="19" x2="70" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C86DC"/>
      <stop offset="100%" stop-color="#084E9E"/>
    </linearGradient>
    <linearGradient id="facet-top" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="35%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="facet-spine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="facet-bot" x1="50%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <clipPath id="tile-clip">
      <rect x="7" y="7" width="94" height="94" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile-clip)">
    <rect x="7" y="7" width="94" height="94" rx="22" fill="url(#tile)"/>

    <polygon points="56,32 70,19 70,73 56,86" fill="url(#side)"/>
    <polygon points="18,32 32,19 70,19 56,32" fill="url(#top)"/>
    <polygon points="18,32 56,32 56,86 18,86" fill="url(#front)"/>
    <line x1="18" y1="32" x2="56" y2="32" stroke="#FFFFFF" stroke-width="0.55" stroke-opacity="0.55" stroke-linecap="round"/>
    <line x1="56" y1="32" x2="70" y2="19" stroke="#FFFFFF" stroke-width="0.4" stroke-opacity="0.4" stroke-linecap="round"/>

    <g fill="#071422">
      <rect x="23" y="40" width="26" height="8" rx="1.6"/>
      <rect x="23" y="55" width="26" height="8" rx="1.6"/>
      <rect x="23" y="70" width="26" height="8" rx="1.6"/>
    </g>
    <g fill="#1A3E62">
      <rect x="26" y="43.2" width="11" height="1.6" rx="0.8"/>
      <rect x="26" y="58.2" width="11" height="1.6" rx="0.8"/>
      <rect x="26" y="73.2" width="11" height="1.6" rx="0.8"/>
    </g>
    <g fill="#F4FBFF">
      <circle cx="45.2" cy="44" r="1.25"/>
      <circle cx="45.2" cy="59" r="1.25"/>
      <circle cx="45.2" cy="74" r="1.25"/>
    </g>

    <!-- YarmiplayTV play prism, scaled down and set at the lower right -->
    <g transform="translate(93 78) scale(0.032995) translate(-903 -512)">
      <polygon points="460,512 903,512 263,906" fill="url(#facet-bot)"/>
      <polygon points="263,118 460,512 263,906" fill="url(#facet-spine)"/>
      <polygon points="263,118 903,512 460,512" fill="url(#facet-top)"/>
      <line x1="460" y1="512" x2="903" y2="512" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="12" stroke-linecap="round"/>
      <line x1="263" y1="118" x2="460" y2="512" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="10" stroke-linecap="round"/>
      <line x1="263" y1="906" x2="460" y2="512" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <rect x="7.4" y="7.4" width="93.2" height="93.2" rx="21.6" fill="none" stroke="url(#rim)" stroke-width="0.8"/>
</svg>
