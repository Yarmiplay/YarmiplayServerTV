# Flatpak of YarmiplayServerTV, built from source offline. The release workflow's flathub job copies this folder
# into the flathub/com.yarmiplay.servertv repository with the generated files next to it:
#   app-source.json       the release tag and commit (python scripts/linux_packaging.py flatpak-sources)
#   jellyfin-sources.json the pinned Jellyfin downloads from src-tauri/jellyfin-manifest.json (same command)
#   shared-modules/       flathub/shared-modules at a pinned commit (same command)
#   cargo-sources.json    flatpak-cargo-generator src-tauri/Cargo.lock
#   node-sources.json     flatpak-node-generator npm package-lock.json
# See packaging/README.md for a local build.
id: com.yarmiplay.servertv
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: yarmiplayservertv
finish-args:
  # Syncplay and Jellyfin listen for other devices; UPnP and the DuckDNS certificate need the internet.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
  # DuckDNS and Jellyfin tokens in the Secret Service
  - --talk-name=org.freedesktop.secrets
  # Media folders for Jellyfin libraries
  - --filesystem=xdg-videos
  - --filesystem=xdg-music
  - --filesystem=xdg-pictures
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt

modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  # The pinned Jellyfin server and jellyfin-ffmpeg, upstream builds checked against their SHA-256, so nothing
  # executable is downloaded at runtime. The app finds them in /app/lib/yarmiplayservertv/jellyfin.
  - name: jellyfin
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/yarmiplayservertv/jellyfin/ffmpeg
      - tar -xJf jellyfin.tar.xz -C /app/lib/yarmiplayservertv/jellyfin
      - tar -xJf jellyfin-ffmpeg.tar.xz -C /app/lib/yarmiplayservertv/jellyfin/ffmpeg
      - install -Dm644 NOTICE.txt /app/lib/yarmiplayservertv/jellyfin/NOTICE.txt
    sources:
      - jellyfin-sources.json

  - name: yarmiplayservertv
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
      env:
        CARGO_HOME: /run/build/yarmiplayservertv/cargo
        CARGO_NET_OFFLINE: "true"
        npm_config_cache: /run/build/yarmiplayservertv/flatpak-node/npm-cache
        npm_config_offline: "true"
        XDG_CACHE_HOME: /run/build/yarmiplayservertv/flatpak-node/cache
    build-commands:
      - npm ci --offline
      - npm run build
      # What "tauri build --no-bundle" runs: the release binary with the web UI from dist/ embedded.
      - cargo --offline build --release --locked --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol
      - install -Dm755 src-tauri/target/release/yarmiplayservertv /app/bin/yarmiplayservertv
      - install -Dm644 packaging/linux/com.yarmiplay.servertv.desktop /app/share/applications/com.yarmiplay.servertv.desktop
      - install -Dm644 packaging/linux/com.yarmiplay.servertv.metainfo.xml /app/share/metainfo/com.yarmiplay.servertv.metainfo.xml
      - |
        for size in 32 64 128 256 512; do
          install -Dm644 src-tauri/icons/${size}x${size}.png /app/share/icons/hicolor/${size}x${size}/apps/com.yarmiplay.servertv.png
        done
    sources:
      - app-source.json
      - cargo-sources.json
      - node-sources.json
