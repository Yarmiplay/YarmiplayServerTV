name: Release

# For a version tag (v1.0.1, v1.1.0), which has to match the version in src-tauri/tauri.conf.json: builds the
# installers for every OS and attaches them to the tag's GitHub release, with latest.json for the app's updater.
# Windows code signing through SignPath (certificate by SignPath Foundation) is prepared but off: the sign-windows
# job only runs once the variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN are set, and until
# then the unsigned installers are released. Before switching it on, add SignPath's required "Code signing
# policy" section (attribution, team roles, privacy) back to the README; the release notes and the download page
# link to it only for signed releases.
# Updates are signed with the updater key in the secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD; its public half is in tauri.conf.json (plugins > updater > pubkey).
# The Microsoft Store package (.msix, unsigned: the Store signs it) is attached to the run. With the variables
# MSSTORE_TENANT_ID, MSSTORE_SELLER_ID and MSSTORE_CLIENT_ID and the secret MSSTORE_CLIENT_SECRET of the
# microsoft-store environment (which only v* tags may use), the msstore job submits it to Partner Center for
# certification once the release is published; see docs/store/README.md.
# The Snap Store follows the published release too: with the variable SNAP_NAME (yarmiplayservertv) and the
# secret SNAPCRAFT_STORE_CREDENTIALS, the snap job builds snap/snapcraft.yaml from the release's .deb, checks that
# it starts, and uploads it to SNAP_CHANNEL (default stable).
# The tag's version must also have a <release> in packaging/linux/com.yarmiplay.servertv.metainfo.xml;
# python scripts/bump-version.py <version> writes all of them. Running the workflow by hand with one of the
# store boxes ticked redoes only those stores for the latest release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      msstore:
        description: Only resubmit the latest release to the Microsoft Store
        type: boolean
        default: false
      snap:
        description: Only republish the latest release to the Snap Store
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-installers:
    if: ${{ !(inputs.msstore || inputs.snap) }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against the app version
        id: version
        run: |
          version=$(python -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "app version $version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version $version in tauri.conf.json"; exit 1
          fi
          python scripts/linux_packaging.py check-metainfo "$version" || {
            echo "::error::The AppStream metainfo has no release $version (python scripts/bump-version.py $version)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      # SignPath's artifact configuration (.github/signpath/artifact-configuration.xml) expects the two
      # installers at the root of the artifact.
      - name: Installers
        run: |
          npx tauri build --bundles msi,nsis
          mkdir windows
          cp src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*.exe windows/
          ls -l windows

      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers-unsigned
          path: windows/
          if-no-files-found: error
          retention-days: 7

      # Kept out of the SignPath artifact: the Store signs the package itself when it is uploaded. It wraps the
      # same yarmiplayservertv.exe the installers contain.
      - name: Store package
        run: pwsh -NoProfile -File scripts/make-msix.ps1 -NoBuild

      - uses: actions/upload-artifact@v7
        with:
          name: windows-store-msix-${{ steps.version.outputs.version }}
          path: src-tauri/target/msix/*.msix
          if-no-files-found: error
          retention-days: 90

  # Replaces the package of the published submission (the listing stays) and commits it for certification,
  # after the GitHub release so the Store never gets a version that failed elsewhere. A draft submission
  # started in Partner Center is discarded; one still in certification makes the job fail.
  # Run by hand, it has to be run on the tag (Use workflow from: v1.2.1), which the environment requires.
  msstore:
    needs: store-release
    if: >-
      always() && needs.store-release.result == 'success' && vars.MSSTORE_CLIENT_ID != '' &&
      (inputs.msstore || !inputs.snap)
    runs-on: windows-latest
    timeout-minutes: 30
    environment: microsoft-store
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-store-msix-${{ needs.store-release.outputs.version }}
          path: msix
          run-id: ${{ needs.store-release.outputs.run-id }}
          github-token: ${{ github.token }}

      # Pinned: this step installs the program that receives the client secret.
      - uses: microsoft/setup-msstore-cli@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.3

      - name: Submit to the Microsoft Store
        shell: pwsh
        env:
          TENANT_ID: ${{ vars.MSSTORE_TENANT_ID }}
          SELLER_ID: ${{ vars.MSSTORE_SELLER_ID }}
          CLIENT_ID: ${{ vars.MSSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          if (-not $env:CLIENT_SECRET) { throw "The microsoft-store environment has no MSSTORE_CLIENT_SECRET secret" }
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed" }
          # The package file itself is the path: msstore picks its MSIX publisher by the .msix extension.
          $msix = (Get-Item msix\*.msix).FullName
          msstore publish $msix --appId 9P6B9C1KXFFQ
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed" }

  # Waits on a Linux runner while the signing request awaits manual approval in SignPath.
  sign-windows:
    needs: windows-installers
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Submit the signing request and wait for its approval
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: YarmiplayServerTV
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.windows-installers.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(needs.windows-installers.outputs.version) }}
          wait-for-completion-timeout-in-seconds: 21000
          output-artifact-directory: signed

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installers-signed
          path: signed/
          if-no-files-found: error
          retention-days: 7

  # The macOS .dmg plus the .app.tar.gz the updater installs, and the Linux .deb and .AppImage, each signed
  # with the updater key.
  other-installers:
    if: ${{ !(inputs.msstore || inputs.snap) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libxdo-dev libssl-dev build-essential file patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - run: npm ci

      - name: Installers
        run: |
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          mkdir out
          if [ "${{ matrix.name }}" = macos ]; then
            npx tauri build --target universal-apple-darwin --bundles app,dmg \
              --config '{"bundle":{"createUpdaterArtifacts":true}}'
            b=src-tauri/target/universal-apple-darwin/release/bundle
            cp "$b"/dmg/*.dmg out/
            cp "$b"/macos/*.app.tar.gz "out/YarmiplayServerTV_${version}_universal.app.tar.gz"
          else
            npx tauri build --bundles deb,appimage
            b=src-tauri/target/release/bundle
            cp "$b"/deb/*.deb "$b"/appimage/*.AppImage out/
          fi
          for f in out/*.app.tar.gz out/*.deb out/*.AppImage; do
            if [ -f "$f" ]; then npx tauri signer sign "$f"; fi
          done
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  # Checks the Windows signatures the way Windows does (including the app inside the .msi), signs the final
  # Windows installers with the updater key (after SignPath, which changes the files), writes latest.json and
  # attaches everything to the tag's release. Without SignPath it releases the unsigned Windows installers.
  publish:
    needs: [windows-installers, sign-windows, other-installers]
    if: >-
      always() && needs.windows-installers.result == 'success' && needs.other-installers.result == 'success' &&
      (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SIGNED: ${{ needs.sign-windows.result == 'success' }}
      VERSION: ${{ needs.windows-installers.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.sign-windows.result == 'success' && 'windows-installers-signed' || 'windows-installers-unsigned' }}
          path: signed

      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: release
          merge-multiple: true

      - name: Verify the signatures
        if: env.SIGNED == 'true'
        shell: pwsh
        run: |
          $msi = Get-Item signed\*.msi
          Start-Process msiexec -Wait -ArgumentList "/a `"$($msi.FullName)`" /qn TARGETDIR=`"$env:RUNNER_TEMP\msi`""
          $files = @(Get-Item signed\*.msi, signed\*.exe) + @(Get-ChildItem "$env:RUNNER_TEMP\msi" -Recurse -Filter yarmiplayservertv.exe)
          if ($files.Count -ne 3) { throw "expected the .msi, the .exe and the app inside the .msi, found $($files.Count) files" }
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            "{0}: {1}, {2}" -f $file.Name, $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne 'Valid' -or -not $sig.TimeStamperCertificate) { throw "$($file.Name) isn't validly signed and timestamped" }
          }

      - name: Updater signatures and latest.json
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cp signed/* release/
          for f in release/*.msi release/*.exe; do npx --yes @tauri-apps/cli@2 signer sign "$f"; done
          python scripts/updater_manifest.py --dir release --version "$VERSION" --tag "v$VERSION" --repo "$GITHUB_REPOSITORY"
          rm release/*.sig
          ls -l release
          cat release/latest.json

      - name: Attach the installers to the release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SIGNED" = true ]; then
            signing="Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org). See the [code signing policy](https://github.com/$GITHUB_REPOSITORY#code-signing-policy)."
          else
            signing="The Windows installers aren't code signed, so Windows SmartScreen may warn: choose More info, then Run anyway."
          fi
          notes="YarmiplayServerTV $VERSION for Windows (.msi or -setup.exe), macOS (.dmg) and Linux (.deb or .AppImage). Installed copies update themselves from here. Download page: https://servertv.yarmiplay.com/

          $signing"
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* -R "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" release/* -R "$GITHUB_REPOSITORY" --verify-tag \
              --title "YarmiplayServerTV $GITHUB_REF_NAME" --notes "$notes"
          fi

  # The release the store jobs publish: this run's tag, or for a hand-run with a store box ticked, the tag it was
  # run on or else the latest release.
  store-release:
    needs: publish
    if: >-
      always() && ((github.ref_type == 'tag' && needs.publish.result == 'success') ||
      (needs.publish.result == 'skipped' && (inputs.msstore || inputs.snap)))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      run-id: ${{ steps.release.outputs.run-id }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_HERE: ${{ needs.publish.result == 'success' }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          else
            tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          # The run that built the tag's Store package
          if [ "$PUBLISHED_HERE" = true ]; then
            run_id=$GITHUB_RUN_ID
          else
            run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow release.yml --branch "$tag" --event push \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          echo "release $tag ($commit), built by run ${run_id:-unknown}"
          { echo "tag=$tag"; echo "version=${tag#v}"; echo "commit=$commit"; echo "run-id=$run_id"; } >> "$GITHUB_OUTPUT"

  # Builds the snap from the release's .deb, installs it and checks that the Syncplay server and the bundled
  # Jellyfin start, then uploads it to SNAP_CHANNEL.
  snap:
    needs: store-release
    if: >-
      always() && needs.store-release.result == 'success' && vars.SNAP_NAME != '' &&
      (inputs.snap || !inputs.msstore)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ needs.store-release.outputs.tag }}
      SNAP_NAME: ${{ vars.SNAP_NAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.store-release.outputs.tag }}

      - name: The release's .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p snap/local
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*_amd64.deb' -O snap/local/yarmiplayservertv.deb
          sed -i "s/^name: .*/name: $SNAP_NAME/" snap/snapcraft.yaml

      - id: build
        uses: snapcore/action-build@v1

      - name: Install it and start it
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb xauth dbus-x11
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          bash packaging/linux/snap-smoke-test.sh "$SNAP_NAME"

      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ vars.SNAP_CHANNEL || 'stable' }}
