name: Linux packages

# Builds the snap (snap/snapcraft.yaml) from this commit's .deb, installs it and starts it headless
# (packaging/linux/snap-smoke-test.sh: the Syncplay server answers and the bundled Jellyfin becomes healthy).
# Publishing is the release workflow's job.
on:
  push:
    branches: [main]
    paths:
      - packaging/**
      - snap/**
      - scripts/linux_packaging.py
      - src-tauri/jellyfin-manifest.json
      - .github/workflows/linux-packages.yml
  pull_request:
    paths:
      - packaging/**
      - snap/**
      - scripts/linux_packaging.py
      - src-tauri/jellyfin-manifest.json
      - .github/workflows/linux-packages.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The .deb as the release builds it, for the snap
  deb:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libxdo-dev libssl-dev build-essential file patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: deb

      - run: npm ci
      - run: npx tauri build --bundles deb

      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 3

  snap:
    needs: deb
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: deb
          path: deb

      - run: mkdir -p snap/local && mv deb/*.deb snap/local/yarmiplayservertv.deb

      - id: build
        uses: snapcore/action-build@v1

      - name: Install it and start it
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb xauth dbus-x11
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          snap connections yarmiplayservertv
          bash packaging/linux/snap-smoke-test.sh yarmiplayservertv

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: ignore
          retention-days: 3
